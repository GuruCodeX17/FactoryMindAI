[project]
name = "factorymindai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Guru", email = "guruarunachalam17@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "matplotlib>=3.11.2",
    "mcp[cli]>=2,<3",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
factorymindai = "factorymindai:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
